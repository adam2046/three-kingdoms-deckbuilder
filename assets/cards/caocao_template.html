<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#121212; display:flex; justify-content:center; align-items:center; min-height:100vh;">
<svg width="450" height="675" viewBox="0 0 450 675">
  <!-- Outer border -->
  <rect width="450" height="675" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="0"/>
  
  <!-- Card inner area -->
  <rect x="10" y="10" width="430" height="655" fill="#f4e4bc"/>
  
  <!-- Gold filigree border (simple) -->
  <rect x="15" y="15" width="420" height="645" fill="none" stroke="#d4af37" stroke-width="3"/>
  <!-- Corner flourishes -->
  <path d="M15 35 L15 15 L35 15" stroke="#d4af37" stroke-width="2" fill="none"/>
  <path d="M415 15 L435 15 L435 35" stroke="#d4af37" stroke-width="2" fill="none"/>
  <path d="M15 640 L15 660 L35 660" stroke="#d4af37" stroke-width="2" fill="none"/>
  <path d="M415 660 L435 660 L435 640" stroke="#d4af37" stroke-width="2" fill="none"/>
  
  <!-- Left sidebar (blue) -->
  <rect x="15" y="75" width="68" height="480" fill="#003366"/>
  
  <!-- Portrait area frame -->
  <rect x="93" y="75" width="337" height="340" fill="#fff8dc" stroke="#d4af37" stroke-width="2"/>
  <rect x="100" y="82" width="323" height="326" fill="#c4a882"/>
  
  <!-- Skills area -->
  <rect x="93" y="423" width="337" height="230" fill="#fdf5e6" stroke="#d4af37" stroke-width="2"/>
  <rect x="100" y="430" width="323" height="216" fill="#fdf5e6"/>
  
  <!-- Faction seal (top left) -->
  <circle cx="49" cy="45" r="22" fill="#003366" stroke="#d4af37" stroke-width="2"/>
  
  <!-- HP indicators (top center) -->
  <circle cx="225" cy="45" r="8" fill="#ffd700"/>
  <circle cx="195" cy="45" r="8" fill="#ffd700"/>
  <circle cx="255" cy="45" r="8" fill="#ffd700"/>
  <circle cx="165" cy="45" r="8" fill="#ffd700"/>
  
  <!-- Skill badges -->
  <rect x="115" y="450" width="70" height="28" rx="14" fill="#0055a4"/>
  <rect x="115" y="510" width="70" height="28" rx="14" fill="#0055a4"/>
  <rect x="115" y="570" width="70" height="28" rx="14" fill="#0055a4"/>
  
  <!-- Skill description areas -->
  <rect x="195" y="450" width="220" height="28" fill="none"/>
  <rect x="195" y="510" width="220" height="28" fill="none"/>
  <rect x="195" y="570" width="220" height="28" fill="none"/>
  
  <!-- Footer decoration -->
  <rect x="15" y="563" width="68" height="92" fill="#003366"/>
  <rect x="15" y="563" width="415" height="92" fill="none" stroke="#d4af37" stroke-width="1"/>
</svg>
</body>
</html>
