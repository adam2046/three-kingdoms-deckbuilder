<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#121212; display:flex; justify-content:center; align-items:center; min-height:100vh;">
<svg width="450" height="675" viewBox="0 0 450 675" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Outer border -->
  <rect width="450" height="675" fill="#0a0a14"/>
  
  <!-- Card inner area -->
  <rect x="10" y="10" width="430" height="655" fill="#e8d4a8"/>
  
  <!-- Gold filigree border -->
  <rect x="15" y="15" width="420" height="645" fill="none" stroke="#c9a227" stroke-width="4"/>
  
  <!-- Decorative inner border -->
  <rect x="22" y="22" width="406" height="631" fill="none" stroke="#8b6914" stroke-width="1"/>
  
  <!-- Left sidebar (Wei faction blue) -->
  <rect x="15" y="70" width="65" height="400" fill="#112244"/>
  
  <!-- Sidebar gold decorative lines -->
  <rect x="75" y="70" width="3" height="400" fill="#c9a227"/>
  <rect x="15" y="70" width="3" height="400" fill="#c9a227"/>
  
  <!-- Portrait area frame -->
  <rect x="88" y="70" width="344" height="300" fill="#3a2a1a" stroke="#c9a227" stroke-width="3"/>
  
  <!-- Pixel art portrait (embedded via image tag) -->
  <!-- Note: In Godot, replace this with your actual sprite/texture -->
  <rect x="95" y="77" width="330" height="286" fill="#2a1a0a"/>
  <!-- 
    To add actual portrait in Godot:
    1. Import caocao_portrait_snes_card.png as a texture
    2. Place it at position (95, 77) with size (330, 286)
  -->
  
  <!-- Hero name area (vertical sidebar) - placeholder -->
  <rect x="20" y="120" width="50" height="280" fill="#0d1a2d" stroke="#335588" stroke-width="1"/>
  
  <!-- Skills area background -->
  <rect x="88" y="380" width="344" height="272" fill="#f5ecd8" stroke="#c9a227" stroke-width="2"/>
  
  <!-- Skill area inner lines -->
  <rect x="95" y="387" width="330" height="258" fill="none" stroke="#a08040" stroke-width="1"/>
  
  <!-- Faction seal (top left) - Wei -->
  <circle cx="47" cy="42" r="20" fill="#112244" stroke="#c9a227" stroke-width="2"/>
  <circle cx="47" cy="42" r="12" fill="none" stroke="#8b6914" stroke-width="1"/>
  
  <!-- HP indicators (top center) - 4 勾玉 -->
  <rect x="170" y="30" width="22" height="24" rx="6" fill="#c9a227" stroke="#8b6914" stroke-width="1"/>
  <rect x="200" y="30" width="22" height="24" rx="6" fill="#c9a227" stroke="#8b6914" stroke-width="1"/>
  <rect x="230" y="30" width="22" height="24" rx="6" fill="#c9a227" stroke="#8b6914" stroke-width="1"/>
  <rect x="260" y="30" width="22" height="24" rx="6" fill="#c9a227" stroke="#8b6914" stroke-width="1"/>
  
  <!-- HP inner highlight -->
  <rect x="175" y="35" width="12" height="14" rx="3" fill="#e8d888" opacity="0.5"/>
  <rect x="205" y="35" width="12" height="14" rx="3" fill="#e8d888" opacity="0.5"/>
  <rect x="235" y="35" width="12" height="14" rx="3" fill="#e8d888" opacity="0.5"/>
  <rect x="265" y="35" width="12" height="14" rx="3" fill="#e8d888" opacity="0.5"/>
  
  <!-- Skill name badges (blue ovals) for Cao Cao -->
  <!-- 奸雄 (Jian Xiong) - Treacherous Hero -->
  <rect x="110" y="410" width="65" height="26" rx="13" fill="#1a4080" stroke="#3366aa" stroke-width="1"/>
  <!-- 护驾 (Hu Jia) - Protect the Emperor -->
  <rect x="110" y="470" width="65" height="26" rx="13" fill="#1a4080" stroke="#3366aa" stroke-width="1"/>
  
  <!-- Skill description text areas -->
  <rect x="185" y="400" width="235" height="50" fill="none" stroke="#c0a060" stroke-width="0.5"/>
  <rect x="185" y="460" width="235" height="50" fill="none" stroke="#c0a060" stroke-width="0.5"/>
  
  <!-- Divider lines between skills -->
  <line x1="95" y1="455" x2="425" y2="455" stroke="#b09050" stroke-width="0.5"/>
  <line x1="95" y1="515" x2="425" y2="515" stroke="#b09050" stroke-width="0.5"/>
  
  <!-- Footer area -->
  <rect x="15" y="612" width="420" height="48" fill="#112244"/>
  <rect x="15" y="612" width="65" height="48" fill="#0d1a2d"/>
  <line x1="15" y1="612" x2="435" y2="612" stroke="#c9a227" stroke-width="2"/>
  
  <!-- Hero title area at bottom of portrait -->
  <rect x="95" y="323" width="330" height="40" fill="#0a0a0a" opacity="0.8"/>
  <rect x="95" y="323" width="330" height="2" fill="#c9a227"/>
  
  <!-- Corner decorative gold elements -->
  <!-- Top left -->
  <rect x="15" y="15" width="20" height="4" fill="#c9a227"/>
  <rect x="15" y="15" width="4" height="20" fill="#c9a227"/>
  <!-- Top right -->
  <rect x="415" y="15" width="20" height="4" fill="#c9a227"/>
  <rect x="431" y="15" width="4" height="20" fill="#c9a227"/>
  <!-- Bottom left -->
  <rect x="15" y="656" width="20" height="4" fill="#c9a227"/>
  <rect x="15" y="640" width="4" height="20" fill="#c9a227"/>
  <!-- Bottom right -->
  <rect x="415" y="656" width="20" height="4" fill="#c9a227"/>
  <rect x="431" y="640" width="4" height="20" fill="#c9a227"/>
</svg>
</body>
</html>
